services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paracolor
      POSTGRES_USER: paracolor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paracolor -d paracolor"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      PUBLIC_APP_URL: https://${APP_DOMAIN}
      DATABASE_URL: postgresql://paracolor:${POSTGRES_PASSWORD}@db:5432/paracolor
      SESSION_SECRET: ${SESSION_SECRET:?configure SESSION_SECRET in .env}
      STORAGE_DIR: /var/lib/paracolor/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?configure BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?configure BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador Paracolor}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-}
      APP_VERSION: ${APP_VERSION:-1.0.5}
      UPDATE_STATE_DIR: /var/lib/paracolor/app-output/updates
      BACKUP_DIR: /var/lib/paracolor/backups
      MAX_BACKUP_MB: ${MAX_BACKUP_MB:-10240}
    volumes:
      - uploads_data:/var/lib/paracolor/uploads
      - app_output:/var/lib/paracolor/app-output
      backups_data:/var/lib/paracolor/backups
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?configure APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

volumes:
  postgres_data:
  uploads_data:
  app_output:
  backups_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
